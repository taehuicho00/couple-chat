<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>우리 둘</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF9FC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191B34">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 둘">
<!-- 글씨: 베트남어는 Be Vietnam Pro, 한글은 고운돋움. 못 불러오면 휴대폰 기본 글씨로 보인다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Gowun+Dodum&display=swap" media="print" onload="this.media='all'">
<style>
  /* ===== 색 =====
     두 사람, 두 언어, 두 가지 색. 한국어는 쪽빛(jjok), 베트남어는 연꽃색(sen).
     말풍선 색은 '누가 한 말인지'를, 말풍선 안 둘째 줄의 색은 '어느 나라 말인지'를 알려 준다. */
  :root{
    --paper:#F8F5F9; --surface:#FFFFFF; --ink:#201D38; --ink-2:#615D7B; --ink-3:#6F6B8A; --line:#E7E1EC;
    --jjok:#3347A8; --jjok-soft:#E2E7FA; --jjok-ink:#1F2C73; --jjok-pale:#EDF0FF; --jjok-rule:rgba(31,44,115,.16); --jjok-wash:rgba(51,71,168,.08);
    --sen:#C42863;  --sen-soft:#FBDFE9;  --sen-ink:#8A1A44;  --sen-pale:#FFD9E6;  --sen-rule:rgba(138,26,68,.16);  --sen-wash:rgba(196,40,99,.08);
    --both:#7E3A8C; --both-solid:#7E3A8C; --both-soft:#F2E7F5; --both-ink:#5B2468; --leaf:#23805F; --warn:#A64B08; --danger:#C22B38;
    --glass:rgba(255,255,255,.84);
    --font:"Be Vietnam Pro","Gowun Dodum",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#131428; --surface:#1B1D38; --ink:#EEEBFA; --ink-2:#A7A3C4; --ink-3:#8683A6; --line:#2C2E50;
    --jjok:#4759C6; --jjok-soft:#262B58; --jjok-ink:#C3CCFF; --jjok-pale:#F0F3FF; --jjok-rule:rgba(195,204,255,.22); --jjok-wash:rgba(71,89,198,.16);
    --sen:#C2356B;  --sen-soft:#43203A;  --sen-ink:#FFBFD6;  --sen-pale:#FFDCE8;  --sen-rule:rgba(255,191,214,.22);  --sen-wash:rgba(194,53,107,.16);
    --both:#A86BB8; --both-solid:#8B4D9C; --both-soft:#3A2446; --both-ink:#E9C9F2; --leaf:#58C9A1; --warn:#F0A45B; --danger:#FF8A93;
    --glass:rgba(27,29,56,.84);
  }}
  /* 내 색(me)과 상대 색(them): 내 언어에 따라 정해진다 */
  html{ --me:var(--jjok); --me-soft:var(--jjok-soft); --me-ink:var(--jjok-ink); --me-wash:var(--jjok-wash);
        --them:var(--sen); --them-soft:var(--sen-soft); --them-ink:var(--sen-ink); --them-rule:var(--sen-rule); --them-wash:var(--sen-wash);
        --gloss-on-me:var(--sen-pale) }
  html[data-me="vi"]{ --me:var(--sen); --me-soft:var(--sen-soft); --me-ink:var(--sen-ink); --me-wash:var(--sen-wash);
        --them:var(--jjok); --them-soft:var(--jjok-soft); --them-ink:var(--jjok-ink); --them-rule:var(--jjok-rule); --them-wash:var(--jjok-wash);
        --gloss-on-me:var(--jjok-pale) }
  /* 아직 언어를 고르지 않은 처음 화면: 두 색이 겹친 자주색 */
  html[data-me="none"]{ --me:var(--both-solid); --me-soft:var(--both-soft); --me-ink:var(--both-ink) }

  /* ===== 바탕 ===== */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  html{font-synthesis:none;-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all}   /* keep-all: 한글이 낱말 중간에서 끊기지 않게 */
  /* 바탕에 두 사람의 색이 아주 옅게 번져 있다: 위쪽은 상대 색, 아래쪽은 내 색 */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(80% 46% at 100% 0%,var(--them-wash),transparent 72%),radial-gradient(85% 50% at 0% 100%,var(--me-wash),transparent 72%)}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--me);outline-offset:2px}
  textarea:focus-visible,input:focus-visible{outline:0}   /* 글 쓰는 칸은 테두리 색으로 표시한다 */
  [hidden]{display:none!important}
  @keyframes pulse{50%{opacity:.45}}
  @keyframes fade{from{opacity:0}}

  .app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;position:relative}

  /* ===== 머리줄: 상대 이름과 방 상태 ===== */
  header{display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px 16px;position:relative;z-index:2;
    background:var(--glass);border-bottom:1px solid var(--line)}
  .avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;
    background:var(--them-soft);color:var(--them-ink)}
  .avatar[data-lang=ko]{background:var(--jjok-soft);color:var(--jjok-ink)}
  .avatar[data-lang=vi]{background:var(--sen-soft);color:var(--sen-ink)}
  .avatar.none{background:none}
  .avatar svg{width:38px;height:auto;display:block}
  .who{flex:1;min-width:0}
  header h1{font-size:18px;font-weight:500;margin:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .notice{display:flex;align-items:center;gap:6px;max-width:100%;border:0;background:none;padding:0;text-align:left;
    font-size:12.5px;line-height:1.4;color:var(--ink-2);cursor:default}
  .notice::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
  .notice span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .notice.ok::before{background:var(--leaf)}
  .notice.warn{color:var(--warn);cursor:pointer}
  .notice.warn::before{background:var(--warn)}
  .notice.busy::before{animation:pulse 1.2s infinite}
  .notice.off{visibility:hidden}
  .iconbtn{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--ink-2);display:grid;place-items:center}
  .iconbtn:active{background:var(--line)}
  .iconbtn svg{width:23px;height:23px}

  /* 잠깐 떴다 사라지는 안내 */
  #toast{position:absolute;left:50%;top:calc(68px + env(safe-area-inset-top));z-index:5;transform:translate(-50%,-8px);
    width:max-content;max-width:calc(100% - 32px);padding:9px 15px;border-radius:14px;background:var(--ink);color:var(--paper);
    font-size:13.5px;line-height:1.45;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.warn{background:var(--danger);color:var(--surface)}

  /* ===== 대화 ===== */
  #list{flex:1;overflow-y:auto;overscroll-behavior:contain}
  #flow{display:flex;flex-direction:column;min-height:100%;padding:10px 14px}
  .day{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-3);margin:16px 6px 6px}
  .day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
  .older{align-self:center;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13px;padding:8px 16px;border-radius:999px;margin:4px 0}
  .row{display:flex;flex-direction:column;margin-top:10px}
  .row.cont{margin-top:3px}
  .row.me{align-items:flex-end}
  .row.other{align-items:flex-start}
  .name{font-size:12px;color:var(--ink-2);margin:0 8px 3px}
  .line{display:flex;align-items:flex-end;gap:6px;max-width:88%}
  .row.me .line{flex-direction:row-reverse}
  .bubble{min-width:0;padding:9px 14px 10px;border-radius:20px;font-size:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:pretty;cursor:pointer}
  .row.me .bubble{background:var(--me);color:#fff;border-bottom-right-radius:6px}
  .row.other .bubble{background:var(--them-soft);color:var(--ink);border-bottom-left-radius:6px}
  .row.me.cont .bubble{border-top-right-radius:8px}
  .row.other.cont .bubble{border-top-left-radius:8px}
  .main{display:block}
  /* 둘째 줄: 같은 말의 다른 나라 말. 그 언어의 색으로 쓴다 */
  .sub{display:block;margin-top:6px;padding-top:6px;border-top:1px solid;font-size:13.5px;line-height:1.45}
  .row.me .sub{color:var(--gloss-on-me);border-top-color:rgba(255,255,255,.3)}
  .row.other .sub{color:var(--them-ink);border-top-color:var(--them-rule)}
  .sub.wait{animation:pulse 1.2s infinite}
  .row.other .sub.bad{color:var(--danger)}
  .row.me .sub.bad{color:#fff;text-decoration:underline}
  .meta{flex:none;display:flex;flex-direction:column;font-size:11px;line-height:1.35;color:var(--ink-3);padding-bottom:2px;white-space:nowrap}
  .row.me .meta{align-items:flex-end}
  .meta .bad{color:var(--danger)}
  .empty{margin:auto;text-align:center;padding:28px;max-width:310px}
  .empty svg{width:78px;height:auto;margin-bottom:14px}
  .empty b{display:block;font-weight:400;font-size:17px;margin-bottom:6px}
  .empty span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.55;text-wrap:balance}
  /* 채팅 안의 스티커·사진 */
  .sticker{width:132px;height:132px}
  .sticker svg{width:100%;height:100%}
  .sticker img{width:100%;height:100%;object-fit:contain;display:block}
  .sticker.wait{display:grid;place-items:center;font-size:34px;border-radius:26px;background:var(--line);animation:pulse 1.2s infinite}
  .photo{display:block;border-radius:18px;max-width:min(250px,64vw);max-height:330px;object-fit:cover;cursor:zoom-in;background:var(--line)}
  .photo.loading{width:200px;height:200px;animation:pulse 1.2s infinite}
  @media (prefers-reduced-motion:no-preference){
    .row.new{animation:rise .2s ease-out both}
    #panel.show{animation:panel .2s ease-out}
    #setup.show{animation:fade .16s ease-out}
    .brand .a{animation:meet-a .8s cubic-bezier(.2,.8,.2,1) both}
    .brand .b{animation:meet-b .8s cubic-bezier(.2,.8,.2,1) both}
    .brand .lens{animation:fade .45s .5s both}
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  @keyframes panel{from{opacity:0;transform:translateY(14px)}}
  @keyframes meet-a{from{transform:translateX(-9px)}}
  @keyframes meet-b{from{transform:translateX(9px)}}

  /* ===== 입력줄 ===== */
  footer{display:flex;align-items:flex-end;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom)) 6px;
    background:var(--glass);border-top:1px solid var(--line)}
  .tool{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:none;color:var(--ink-2);display:grid;place-items:center}
  .tool svg{width:24px;height:24px}
  .tool:active{background:var(--line)}
  .tool.on{color:var(--me);background:var(--me-soft)}
  textarea{flex:1;min-width:0;resize:none;font-size:16px;line-height:1.4;padding:9px 16px;margin:0 4px 0 2px;border-radius:21px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);max-height:120px;outline:0}
  textarea::placeholder{color:var(--ink-3)}
  textarea:focus{border-color:var(--me)}
  .sendbtn{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--me);color:#fff;display:grid;place-items:center;transition:transform .12s,opacity .12s}
  .sendbtn svg{width:22px;height:22px}
  .sendbtn:active{transform:scale(.92)}
  .sendbtn:disabled{opacity:.32}

  /* ===== 이모티콘 창 ===== */
  #panel{display:none;flex-direction:column;height:min(300px,44dvh);background:var(--surface);border-top:1px solid var(--line)}
  #panel.show{display:flex}
  .tabs{display:flex;gap:2px;padding:6px 8px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;min-width:46px;height:42px;border:0;border-bottom:2px solid transparent;background:none;padding:0 8px 2px;
    font-size:21px;line-height:1;display:grid;place-items:center;opacity:.5}
  .tabs button img{width:30px;height:30px;object-fit:contain;display:block}
  .tabs button.on{opacity:1;border-bottom-color:var(--me)}
  .grid{flex:1;overflow-y:auto;display:grid;gap:6px;padding:10px;align-content:start}
  .grid.st{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
  .grid.em{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
  .ptitle{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);padding:0 4px}
  .grid button{border:0;background:none;border-radius:14px;padding:4px}
  .grid button:active{background:var(--paper)}
  .grid.st button svg,.grid.st button img{width:100%;height:auto;display:block}
  .grid.st button span{display:block;font-size:11px;color:var(--ink-2);margin-top:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid.em button{font-size:27px;line-height:1;padding:7px 0}
  .packhint{grid-column:1/-1;font-size:13px;color:var(--ink-2);line-height:1.55;padding:4px}
  .packadd{grid-column:1/-1;display:flex;gap:6px;padding:6px 2px 2px}
  .packadd input{flex:1;min-width:0;padding:9px 12px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);outline:0}
  .packadd input:focus{border-color:var(--me)}
  .grid .packadd button{background:var(--me);color:#fff;font-size:14px;padding:0 16px;border-radius:12px}
  .grid .packadd button:disabled{opacity:.5}

  /* ===== 사진 크게 보기 ===== */
  #viewer{position:fixed;inset:0;background:rgba(10,10,24,.95);display:none;align-items:center;justify-content:center;z-index:20}
  #viewer.show{display:flex}
  #viewer img{max-width:100%;max-height:100%;object-fit:contain}
  #viewer .close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:0;
    background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
  #viewer .close svg{width:22px;height:22px}
  #viewer .hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));color:#cfcde0;font-size:12.5px}

  /* ===== 처음 화면 · 설정 ===== */
  #setup{position:fixed;inset:0;z-index:10;display:none;align-items:flex-start;justify-content:center;overflow:auto;background:var(--paper);
    padding:calc(14px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom))}
  #setup.show{display:flex}
  .card{width:100%;max-width:400px;margin:auto}   /* margin:auto = 가운데 정렬 + 화면보다 길면 위에서부터 스크롤 */
  .brand{text-align:center;margin:8px 0 6px}
  .brand svg{width:88px;height:auto;overflow:visible}
  .brand h2{font-size:28px;font-weight:400;margin:10px 0 4px}
  .brand p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6;white-space:pre-line}
  .sethead{display:flex;align-items:center;justify-content:space-between;margin:0 -10px 0 0}
  .sethead h2{font-size:22px;font-weight:400;margin:0}
  label,.label{display:block;font-size:13px;color:var(--ink-2);margin:18px 2px 7px}
  #setup input{width:100%;font-size:16px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:0}
  #setup input:focus{border-color:var(--me)}
  .seg{display:flex;gap:10px}
  .seg button{flex:1;min-height:50px;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
  .seg button.on{border-color:var(--me);background:var(--me-soft);color:var(--me-ink)}
  /* 언어를 고르면 그 언어의 색이 내 색이 된다 */
  .langs button{min-height:66px;font-size:17px;line-height:1.3}
  .langs button small{display:block;font-size:11.5px;color:var(--ink-3)}
  .langs button[data-v=ko].on{background:var(--jjok);border-color:var(--jjok);color:#fff}
  .langs button[data-v=vi].on{background:var(--sen);border-color:var(--sen);color:#fff}
  .langs button.on small{color:rgba(255,255,255,.86)}
  .primary{width:100%;min-height:54px;margin-top:24px;border:0;border-radius:16px;background:var(--me);color:#fff;font-size:17px}
  .primary:active{filter:brightness(.92)}
  .primary:disabled{opacity:.5}
  .err{color:var(--danger);font-size:13.5px;margin-top:10px;text-align:center;min-height:1.2em}
  .passwrap{position:relative}
  #setup .passwrap input{padding-right:52px}
  .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--ink-2);display:grid;place-items:center}
  .eye svg{width:21px;height:21px}
  .hint{font-size:12.5px;color:var(--ink-2);margin:7px 2px 0;line-height:1.55;white-space:pre-line}
  .inapp{display:flex;gap:9px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;
    font-size:12.5px;line-height:1.55;margin-top:14px}
  .inapp::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn);transform:translateY(-1px)}
  .banner{background:var(--me-soft);color:var(--me-ink);border-radius:16px;padding:14px 16px 8px;font-size:15px;line-height:1.5;text-align:center;margin-top:20px}
  .banner span,.inapp span{white-space:pre-line}
  .banner b{display:block;font-weight:400;font-size:12.5px;opacity:.85}
  .banner button{border:0;background:none;color:inherit;font-size:12.5px;text-decoration:underline;padding:8px 8px;opacity:.85}
  .section{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .ghost{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--me);background:none;color:var(--me);font-size:16px;
    display:flex;align-items:center;justify-content:center;gap:8px}
  @media (prefers-color-scheme:dark){.ghost{color:var(--me-ink);border-color:var(--me-ink)}}
  .ghost svg{width:20px;height:20px}
  .ghost:active{background:var(--me-soft)}
  #setup .invite input{margin-top:8px;font-size:12.5px}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;border:0;background:none;padding:4px 2px;text-align:left;font-size:15.5px;color:var(--ink)}
  .switch i{flex:none;width:46px;height:28px;border-radius:14px;background:var(--ink-3);position:relative;transition:background .15s}
  .switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
  .switch[aria-checked=true] i{background:var(--me)}
  .switch[aria-checked=true] i::after{transform:translateX(18px)}
  .ver{text-align:center;font-size:11px;color:var(--ink-3);margin-top:22px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar none" id="avatar" aria-hidden="true"></div>
    <div class="who">
      <h1 id="title">우리 둘</h1>
      <button type="button" class="notice off" id="notice"><span></span></button>
    </div>
    <button type="button" class="iconbtn" id="settingsBtn" aria-label="설정 · Cài đặt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
  </header>

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));

function flash(text, warn){
  const el=$('toast'); el.textContent=text; el.className=(warn?'warn ':'')+'show';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 4500);
}
const roleWord = r => r==='f'?'Girlfriend':r==='m'?'Boyfriend':'Partner';
function contextBefore(ts){
  return msgs.filter(m=>m.ts<ts).slice(-6).map(m=>{
    const body = m.kind==='image' ? '[sent a photo]' : m.kind==='sticker' ? stickerText(m) : m.text;
    return `${roleWord(m.role)}: ${body}`;
  }).join('\n');
}

// ===== 사진 이모티콘 묶음 =====
// 묶음 파일(packs/<id>.bin)은 사이트와 함께 올라가지만 AES-256-GCM으로 암호화돼 있다.
// 여는 열쇠가 든 '코드'는 이 기기와 방 안(참여자 문서)에만 저장되므로, 방에 들어온 사람만 그림을 볼 수 있다.
const PACK_RE = /^([a-f0-9]{8,32})\.([A-Za-z0-9_-]{43})$/;
const packs = new Map();        // 묶음 id -> { stickers:[{id,data,ko,vi}] }
const packState = new Map();    // 묶음 id -> 'loading' | 'ok'
let roomPacks = new Set();      // 지금 방에서 쓰는 묶음 id (넣은 순서)
const b64u = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '='.repeat((4 - s.length%4)%4)), c=>c.charCodeAt(0));
async function loadPack(code){
  const m = PACK_RE.exec(String(code||'').trim()); if(!m) return 'bad';
  const [, id, key] = m;
  if(packState.get(id)==='ok') return packs.get(id).key===key ? 'ok' : 'bad';
  if(packState.get(id)==='loading') return 'loading';
  packState.set(id,'loading');
  try{
    // 사이트에 아직 반영되지 않았으면(배포가 늦을 때) 저장소 원본에서 바로 받아 온다
    let res=null, trouble=false;
    for(const u of [`./packs/${id}.bin`, `https://raw.githubusercontent.com/taehuicho00/couple-chat/main/packs/${id}.bin`]){
      try{ const r = await fetch(u, { cache:'no-cache' }); if(r.ok){ res=r; break; } if(r.status!==404) trouble=true; }
      catch{ trouble=true; }
    }
    if(!res){ packState.delete(id); return trouble ? 'fail' : 'bad'; }
    const buf = new Uint8Array(await res.arrayBuffer());
    let plain;
    try{
      const k = await crypto.subtle.importKey('raw', b64u(key), 'AES-GCM', false, ['decrypt']);
      plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:buf.slice(0,12) }, k, buf.slice(12));
    }catch{ packState.delete(id); return 'bad'; }       // 열쇠가 틀리면 여기서 걸린다
    const data = JSON.parse(new TextDecoder().decode(plain));
    const list = (Array.isArray(data.stickers) ? data.stickers : [])
      .filter(s => s && /^[a-z0-9]{1,16}$/.test(s.id) && typeof s.data==='string' && s.data.length < 400000
                   && /^data:image\/(webp|png);base64,[A-Za-z0-9+/=]+$/.test(s.data))
      .slice(0,60).map(s => ({ id:s.id, data:s.data, ko:String(s.ko||'').slice(0,30), vi:String(s.vi||'').slice(0,30) }));
    if(!list.length){ packState.delete(id); return 'bad'; }
    packs.set(id, { stickers:list, key }); packState.set(id,'ok');
    return 'ok';
  }catch(e){ console.error('이모티콘 묶음 불러오기 실패', e); packState.delete(id); return 'fail'; }
}
const packKey = () => 'packs:' + roomId;
function savedCodes(){ try{ return JSON.parse(store.get(packKey())||'[]').filter(c=>typeof c==='string' && PACK_RE.test(c)); }catch{ return []; } }
function saveCode(code){ const s=new Set(savedCodes()); if(s.has(code)) return; s.add(code); store.set(packKey(), JSON.stringify([...s])); }
// 이 방에서 묶음을 쓴다: 불러와서 목록에 넣고 화면을 다시 그린다
async function usePack(code){
  const rid = roomId;
  const r = await loadPack(code);
  if(r==='ok' && rid===roomId){
    roomPacks.add(PACK_RE.exec(code.trim())[1]); saveCode(code.trim());
    render(); if($('panel').classList.contains('show')) drawPanel();
  }
  return r;
}
// 코드로 추가: 내 참여자 문서에 적어 두면 같은 방의 상대 기기에도 자동으로 생긴다
async function addPack(code){
  code = String(code||'').trim();
  const r = await usePack(code);
  if(r!=='ok') return r;
  if(roomId && uid) setDoc(doc(fs,'rooms',roomId,'members',uid), { packs: arrayUnion(code) }, { merge:true }).catch(e=>console.error(e));
  flash(t('packOk').replace('{n}', packs.get(PACK_RE.exec(code)[1]).stickers.length));
  return 'ok';
}
function packSticker(ref){
  const m = /^p:([a-f0-9]{8,32}):([a-z0-9]{1,16})$/.exec(ref||''); if(!m) return null;
  const pk = packs.get(m[1]); return pk ? (pk.stickers.find(s=>s.id===m[2]) || null) : null;
}
const isPackSticker = m => typeof m.sticker==='string' && m.sticker.startsWith('p:');
function stickerText(m){
  if(isPackSticker(m)){ const s=packSticker(m.sticker); return '[sent a photo sticker' + (s && s.ko ? `: "${s.ko}"` : '') + ']'; }
  return `[sent a sticker: "${stickerLabel(m.sticker,'ko')}"]`;
}
// 주소 뒤에 #pack=코드 가 붙어 있으면 꺼내고, 열쇠가 주소창·방문 기록에 남지 않게 바로 지운다
function takeHashCode(){
  const m = /^#pack=(.+)$/.exec(location.hash||''); if(!m) return null;
  try{ history.replaceState(null, '', location.pathname + location.search); }catch{}
  let c=''; try{ c = decodeURIComponent(m[1]).trim(); }catch{}
  return PACK_RE.test(c) ? c : null;
}
let pendingPack = takeHashCode();
function addPending(){
  if(!pendingPack || !roomId || !uid) return;
  const c = pendingPack; pendingPack = null;
  addPack(c).then(r=>{ if(r!=='ok') flash(t(r==='bad'?'packBad':'packFail'), true); });
}
// ===== 초대 링크 (#room=방 주소) =====
// 비밀번호를 손으로 입력하다 한 글자라도 달라지면 서로 다른 방이 된다. 그래서 방 주소를 링크로 넘겨받아 그대로 들어가게 한다.
// 링크를 눌러도 바로 방이 바뀌지는 않고, 설정 화면에서 '입장'을 눌러야 들어간다 (엉뚱한 링크로 방이 바뀌는 일 방지).
function readHashRoom(){ const m = /^#room=([a-f0-9]{64})$/.exec(location.hash||''); return m ? m[1] : null; }
// 방 주소는 '입장'이나 '취소'를 누를 때까지 주소창에 남겨 둔다:
// 메신저 안에서 열린 화면에서 'Safari로 열기'를 눌러도 초대가 그대로 따라가게 하려는 것. 끝나면 지운다.
function dropInvite(){
  inviteRoom = null;
  if(/^#room=/.test(location.hash||'')){ try{ history.replaceState(null, '', location.pathname + location.search); }catch{} }
}
let inviteRoom = readHashRoom();
window.addEventListener('hashchange', ()=>{
  const c = takeHashCode(); if(c){ pendingPack = c; addPending(); }
  const r = readHashRoom();
  if(r){ if(r===roomId){ dropInvite(); flash(t('alreadyIn')); } else { inviteRoom = r; openSetup(); } }
});
// 메신저 안에서 열린 브라우저인지 (카카오톡·Zalo·메신저·인스타그램 등). 이런 화면은 Safari·Chrome과 저장 공간이 따로다.
const IN_APP = /KAKAOTALK|Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|NAVER\(inapp|MicroMessenger|BytedanceWebview|musical_ly|TikTok/i.test(navigator.userAgent||'');

// ===== 번역 (Gemini) =====
function buildPrompt(text, target, senderRole, context){
  const viRule = senderRole==='f'
    ? 'In Vietnamese the sender (girlfriend) refers to herself as "em" and calls him "anh".'
    : senderRole==='m'
    ? 'In Vietnamese the sender (boyfriend) refers to himself as "anh" and calls her "em".'
    : 'In Vietnamese use the couple pronouns "anh"/"em" naturally.';
  return `You translate private chat messages between a Korean–Vietnamese couple who are lovers.
Translate the message into ${target==='ko'?'Korean':'Vietnamese'}.

Tone rules (very important):
- Sound like a real couple texting each other: warm, casual, affectionate, natural. Never stiff, formal, or textbook-like.
- Korean: casual 반말 the way Korean couples text (e.g. "뭐해?", "보고 싶어", "밥 먹었어?", "잘 자~"). No 존댓말 (-요/-습니다) unless the original is clearly polite or joking. Natural endings like ~어/~야/~지/~네.
- Vietnamese: ${viRule} Use natural texting particles where they fit (nhé, nha, à, ơi, hen, đó, nè). Avoid formal words.
- Translate the meaning and feeling, not word by word. Keep emoji and line breaks.
- Convert laughter and text emoticons to what the reader's language uses: Korean ㅋㅋ → haha, ㅎㅎ → hihi, ㅠㅠ/ㅜㅜ → huhu; Vietnamese haha/hihi/hehe/kkk/keke/kaka → ㅋㅋ/ㅎㅎ (keep roughly the same length), huhu → ㅠㅠ. A Vietnamese translation must not contain any Korean letters, and a Korean translation should not keep Vietnamese words. Do not add or double laughter that is not in the original.
- Keep pet names natural (자기야 ↔ anh yêu/em yêu, 여보 ↔ vợ ơi/chồng ơi) but never add affection that is not in the original.
- If the message is already in the target language, return it unchanged.

Recent conversation (context only, do not translate):
${context||'(none)'}

Message from the ${roleWord(senderRole)}:
<<<
${text}
>>>

Return ONLY JSON: {"src":"<ISO 639-1 code of the original>","text":"<translation>"}`;
}
async function translate(text, target, senderRole, context){
  if(!model) throw new Error('no model');
  const res = await model.generateContent(buildPrompt(text.slice(0,2000), target, senderRole, context));
  const raw = res.response.text();
  let out;
  try{ out = JSON.parse((raw.match(/\{[\s\S]*\}/)||[raw])[0]); }catch{ out = { src:'', text: raw.trim() }; }
  let tr = String(out.text||'').trim();
  if(target==='vi') tr = tr.replace(/ㅋ+/g,'haha').replace(/ㅎ+/g,'hihi').replace(/[ㅠㅜ]+/g,'huhu');
  return { src:String(out.src||'').slice(0,2).toLowerCase(), text:tr };
}
// 받은 메시지 번역 대기열: 한꺼번에 여러 개를 보내지 않고 하나씩 처리
const trQueue=[]; const trQueued=new Set(); let trBusy=false;
function queueTranslate(m, target){
  const key=m.id+target;
  if(trQueued.has(key) || inflight.has(key)) return;
  trQueued.add(key); trQueue.push({m, target}); pumpQueue();
}
async function pumpQueue(){
  if(trBusy) return; trBusy=true;
  while(trQueue.length){
    const {m, target} = trQueue.shift();
    await translateAndSave(m, target);
    trQueued.delete(m.id+target);
    await new Promise(r=>setTimeout(r, failed.has(m.id) ? 5000 : 800));   // 실패하면 잠깐 쉬었다가 다음 것
  }
  trBusy=false;
}
async function translateAndSave(m, target){
  if(inflight.has(m.id+target)) return;
  inflight.add(m.id+target); failed.delete(m.id); render();
  try{
    const r = await translate(m.text, target, m.role, contextBefore(m.ts));
    if(!r.text) throw new Error('empty');
    const upd = { ['tr.'+target]: r.text };
    if(!m.src && r.src) upd.src = r.src;
    await updateDoc(doc(fs,'rooms',roomId,'messages',m.id), upd);
  }catch(e){
    console.error('번역 실패', e);
    failed.add(m.id);
  }finally{ inflight.delete(m.id+target); render(); }
}

// ===== 그리기 =====
const locale = () => me.lang==='vi' ? 'vi-VN' : 'ko-KR';
const fmtTime = ts => new Date(ts).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'});
const fmtDay = ts => { const d=new Date(ts), n=new Date();
  if(d.toDateString()===n.toDateString()) return t('today');
  return d.toLocaleDateString(locale(), { ...(d.getFullYear()!==n.getFullYear() ? { year:'numeric' } : {}), month:'long', day:'numeric', weekday:'long' }); };
let recheck=null;
let loaded=false;          // 이 방의 대화를 서버에서 한 번이라도 받았는지
let canAnimate=false;      // 처음 불러온 대화는 그대로 두고, 그 뒤에 새로 온 말풍선만 떠오르게 한다
let shownIds=new Set();    // 화면에 이미 그린 메시지
let msgLimit=200, hasOlder=false, keepPos=null;   // 이전 대화 더 보기
function emptyEl(){
  const e=document.createElement('div'); e.className='empty'; e.innerHTML=MARK;
  const b=document.createElement('b'); b.textContent=t('emptyTitle');
  const s=document.createElement('span'); s.textContent=t('emptyBody');
  e.append(b, s); return e;
}
// 맨 아래를 보고 있는지 (새 말풍선·사진·글씨가 뒤늦게 자리를 차지해도 계속 맨 아래에 붙여 두기 위해)
let stick=true;
$('list').addEventListener('scroll', ()=>{ const l=$('list'); stick = l.scrollHeight-l.scrollTop-l.clientHeight < 80; }, { passive:true });
if(window.ResizeObserver){ const ro=new ResizeObserver(()=>{ if(stick){ const l=$('list'); l.scrollTop=l.scrollHeight; } }); ro.observe($('flow')); ro.observe($('list')); }
function render(){
  const scroller=$('list'), list=$('flow');
  const top=scroller.scrollTop;
  list.textContent='';
  const all = [...msgs, ...localPending].sort((a,b)=>a.ts-b.ts);
  if(!all.length){ if(loaded) list.appendChild(emptyEl()); }
  else if(hasOlder){
    // 지금 보이는 것보다 오래된 대화가 서버에 더 있다. 누르면 300개씩 더 불러온다 (대화는 지워지지 않고 서버에 그대로 있다)
    const b=document.createElement('button'); b.type='button'; b.className='older'; b.textContent=t('older');
    b.onclick=()=>{ keepPos={ h:scroller.scrollHeight, top:scroller.scrollTop, n:msgs.length }; msgLimit+=300; listenMsgs(); };
    list.appendChild(b);
  }
  const other = me.lang==='ko'?'vi':'ko';
  const crowd = otherPeople().length>1;        // 셋 이상 모인 방에서만 이름표를 붙인다 (둘이면 머리줄의 이름으로 충분하다)
  const animate = canAnimate && !keepPos;
  let prev=null, lastDay='', next=Infinity;
  for(let i=0;i<all.length;i++){
    const m=all[i], nx=all[i+1];
    const day=new Date(m.ts).toDateString();
    if(day!==lastDay){ const d=document.createElement('div'); d.className='day'; d.textContent=fmtDay(m.ts); list.appendChild(d); lastDay=day; prev=null; }
    const mine=isMine(m), who=whoOf(m);
    const cont = prev && whoOf(prev)===who && m.ts-prev.ts<120000;
    // 시간은 같은 사람이 같은 분에 이어 보낸 말풍선 묶음의 마지막에만 붙인다
    const lastOfMinute = !nx || whoOf(nx)!==who || new Date(nx.ts).toDateString()!==day || Math.floor(nx.ts/60000)!==Math.floor(m.ts/60000);
    const row=document.createElement('div');
    row.className='row '+(mine?'me':'other')+(cont?' cont':'')+(animate && !shownIds.has(m.id)?' new':'');
    if(crowd && !mine && !cont){ const n=document.createElement('div'); n.className='name'; n.textContent=m.name||'💕'; row.appendChild(n); }
    const line=document.createElement('div'); line.className='line';
    const meta=document.createElement('div'); meta.className='meta';
    const note=text=>{ const s=document.createElement('span'); s.className='bad'; s.textContent=text; meta.appendChild(s); };
    let body;
    if(m.kind==='sticker' || m.kind==='image'){
      body = m.kind==='sticker' ? stickerEl(m) : photoEl(m);
      if(m.local){ note(t('sendFail')); body.onclick=()=>retrySend(m); }
    } else {
      // 첫 줄은 읽는 사람의 언어, 둘째 줄은 같은 말의 다른 언어(또는 번역 상태)
      const sameLang = m.src ? m.src===me.lang : m.lang===me.lang;
      let main=m.text, sub='', subKind='', twin=false;      // twin: 둘째 줄이 원문·번역일 때 (상태 문구가 아닐 때)
      if(!mine && !sameLang){
        const tr = m.tr && m.tr[me.lang];
        if(tr){ main=tr; if(tr!==m.text){ sub=m.text; twin=true; } }
        else if(failed.has(m.id)){ sub=t('failed'); subKind='bad'; }
        else if(!m.local){
          sub=t('translating'); subKind='wait';
          // 보낸 사람이 번역을 저장할 시간을 8초 기다린 뒤 직접 번역 (중복 비용 방지)
          const age=Date.now()-m.ts;
          if(document.visibilityState!=='visible'){ /* 화면이 다시 켜지면 아래 visibilitychange에서 재시도 */ }
          else if(age>8000) queueTranslate(m, me.lang); else next=Math.min(next, 8000-age+100);
        }
      } else if(mine && !m.local){
        const tr = m.tr && m.tr[other];
        if(tr){ if(tr!==m.text){ sub=tr; twin=true; } }     // 상대에게 어떻게 보이는지
        else if(failed.has(m.id)){ sub=t('failed'); subKind='bad'; }
        else if(inflight.has(m.id+other)){ sub=t('translating'); subKind='wait'; }
      }
      body=document.createElement('div'); body.className='bubble';
      const mn=document.createElement('span'); mn.className='main'; mn.textContent=main; body.appendChild(mn);
      // 둘째 줄은 설정(두 언어 같이 보기)을 따르고, 말풍선을 누르면 그 말풍선만 반대로 바뀐다. 번역 상태는 항상 보인다
      if(sub && (!twin || bothOn!==flipped.has(m.id))){
        const sp=document.createElement('span'); sp.className='sub'+(subKind?' '+subKind:''); sp.textContent=sub; body.appendChild(sp);
      }
      body.onclick=()=>{
        if(m.local){ retrySend(m); return; }
        if(failed.has(m.id)){ translateAndSave(m, mine?other:me.lang); return; }
        if(twin){ flipped.has(m.id)?flipped.delete(m.id):flipped.add(m.id); render(); }
      };
      if(m.local) note(t('sendFail'));
    }
    if(lastOfMinute || meta.childNodes.length){ const tm=document.createElement('span'); tm.className='time'; tm.textContent=fmtTime(m.ts); meta.appendChild(tm); }
    line.append(body, meta); row.appendChild(line); list.appendChild(row); prev=m;
  }
  shownIds = new Set(all.map(m=>m.id));
  if(keepPos && msgs.length>keepPos.n) scroller.scrollTop = scroller.scrollHeight-keepPos.h+keepPos.top;   // 이전 대화를 불러온 뒤에도 보던 자리 그대로
  else scroller.scrollTop = stick ? scroller.scrollHeight : top;
  clearTimeout(recheck); if(next<Infinity) recheck=setTimeout(render,next);
}

// ===== 스티커·사진 그리기 =====
function stickerEl(m){
  const d=document.createElement('div'); d.className='sticker';
  if(isPackSticker(m)){
    const s = packSticker(m.sticker);
    if(s){ const im=document.createElement('img'); im.src=s.data; im.alt=s[me.lang]||s.ko||t('photoSticker'); d.title=im.alt; d.appendChild(im); }
    else { d.classList.add('wait'); d.textContent='📸'; }     // 아직 묶음을 못 불러온 경우
    return d;
  }
  d.innerHTML = stickerSvg(m.sticker) || '';   // 우리가 만든 SVG만 넣음 (외부 입력 아님)
  d.title = stickerLabel(m.sticker, me.lang);
  return d;
}
const imgCache = new Map();   // imageId -> dataURL
const imgLoading = new Set();
function photoEl(m){
  const img=document.createElement('img'); img.className='photo'; img.alt=t('photo');
  // 사진이 뜨기 전에도 자리를 미리 잡아 둔다 (나중에 화면이 밀리지 않게)
  if(m.w>0 && m.h>0){ const k=Math.min(Math.min(250, ($('list').clientWidth||390)*0.64)/m.w, 330/m.h, 1);
    img.style.width=Math.round(m.w*k)+'px'; img.style.height=Math.round(m.h*k)+'px'; }
  const src = m.preview || imgCache.get(m.imageId);
  if(src){ img.src=src; img.onclick=()=>openViewer(src); }
  else { img.classList.add('loading'); loadImage(m.imageId); }
  return img;
}
async function loadImage(id){
  if(!id || imgLoading.has(id) || imgCache.has(id)) return;
  imgLoading.add(id);
  try{
    const snap = await getDoc(doc(fs,'rooms',roomId,'images',id));
    const data = snap.exists() ? snap.data().data : null;
    if(typeof data==='string' && data.startsWith('data:image/')) imgCache.set(id, data);
  }catch(e){ console.error(e); }
  imgLoading.delete(id); render();
}
function openViewer(src){ $('viewer').querySelector('img').src=src; $('viewerHint').textContent=t('save'); $('viewer').classList.add('show'); }

// ===== 사진 압축 (휴대폰 사진 3~10MB → 보통 100~400KB) =====
async function loadBitmap(file){
  try{ return await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch{
    return await new Promise((ok,bad)=>{ const u=URL.createObjectURL(file); const im=new Image();
      im.onload=()=>{ ok(im); }; im.onerror=bad; im.src=u; });
  }
}
async function compress(file){
  const bmp = await loadBitmap(file);
  const W = bmp.width || bmp.naturalWidth, H = bmp.height || bmp.naturalHeight;
  let max=1600, q=0.82, out='';
  for(let i=0;i<8;i++){
    const s=Math.min(1, max/Math.max(W,H));
    const w=Math.round(W*s), h=Math.round(H*s);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(bmp,0,0,w,h);
    out=c.toDataURL('image/jpeg', q);
    if(out.length < 700000) return { data:out, w, h };   // Firestore 문서 1MB 제한 안쪽으로
    if(q>0.6) q-=0.1; else { max=Math.round(max*0.8); q=0.75; }
  }
  throw new Error('too big');
}

// ===== 보내기 =====
function newMsg(extra){
  const ref = doc(collection(fs,'rooms',roomId,'messages'));
  return { ref, m:{ id:ref.id, uid, name:me.name, role:me.role, lang:me.lang, text:'', kind:'text', ts:Date.now(), src:null, tr:{}, ...extra } };
}
async function send(){
  const input=$('input'); const text=input.value.trim();
  if(!text || !roomId || !uid) return;
  input.value=''; autosize();
  const { ref, m } = newMsg({ text:text.slice(0,4000) });
  await writeMsg(ref, m);
}
async function sendSticker(id){
  if(!roomId || !uid) return;
  const { ref, m } = newMsg({ kind:'sticker', sticker:id });
  await writeMsg(ref, m);
}
async function sendPhotos(files){
  if(!roomId || !uid) return;
  for(const file of files){
    if(!file.type.startsWith('image/') && !/\.(heic|heif)$/i.test(file.name)) continue;
    setStatus(t('sendingPhoto'), 'busy');
    let img;
    try{ img = await compress(file); }
    catch(e){ console.error(e); flash(t('photoFail'), true); continue; }
    const imgRef = doc(collection(fs,'rooms',roomId,'images'));
    const { ref, m } = newMsg({ kind:'image', imageId:imgRef.id, w:img.w, h:img.h, preview:img.data });
    imgCache.set(imgRef.id, img.data);
    m.imgRef=imgRef; m.imgData=img.data;
    await writeMsg(ref, m);
  }
  if(membersLoaded) showRoomStatus(); else setStatus('', '');
}
async function writeMsg(ref, m){
  try{
    if(m.kind==='image' && !m.imgSaved){
      await setDoc(m.imgRef, { uid:m.uid, data:m.imgData, w:m.w, h:m.h, ts:m.ts });
      m.imgSaved=true;
    }
    const body = { uid:m.uid, name:m.name, role:m.role, lang:m.lang, kind:m.kind, text:m.text, ts:m.ts, at:serverTimestamp(), src:null, tr:{} };
    if(m.kind==='sticker') body.sticker=m.sticker;
    if(m.kind==='image'){ body.imageId=m.imageId; body.w=m.w; body.h=m.h; }
    await setDoc(ref, body);
  }catch(e){
    console.error(e);
    m.local=true; m.ref=ref; if(!localPending.includes(m)) localPending.push(m); render(); return;
  }
  const i=localPending.indexOf(m); if(i>=0) localPending.splice(i,1);
  // 글자 메시지만 상대 언어로 바로 번역해서 저장
  if(m.kind==='text') translateAndSave(m, me.lang==='ko'?'vi':'ko');
}

// ===== 방 입장 =====
// 대화 듣기: 최근 msgLimit개를 실시간으로 받는다. '이전 대화 더 보기'를 누르면 개수를 늘려 다시 듣는다
function listenMsgs(){
  if(unsubMsgs) unsubMsgs();
  const lim = msgLimit;
  const q = query(collection(fs,'rooms',roomId,'messages'), orderBy('ts'), limitToLast(lim));
  unsubMsgs = onSnapshot(q, snap=>{
    msgs = snap.docs.map(d=>({ id:d.id, ...d.data() })).filter(m=>typeof m.text==='string' && typeof m.ts==='number');
    hasOlder = snap.docs.length >= lim;       // 꽉 채워 왔으면 더 오래된 대화가 남아 있을 수 있다
    loaded = true;
    if(membersLoaded) showRoomStatus();
    render();
    keepPos = null; canAnimate = true;
  }, err=>{ console.error(err); setStatus(t('offline'), 'warn'); });
}
let joinSeq=0, moveHops=0;   // moveHops: 방 합치기 표식을 따라 옮긴 횟수 (서로 가리키는 표식이 있어도 맴돌지 않게)
async function joinRoom(){
  const seq = ++joinSeq;
  // 초대 링크로 들어온 기기는 받은 방 주소를 그대로 쓰고, 아니면 비밀번호로 방 주소를 만든다
  const rid = me.room || await sha256('couple-chat|'+normPass(me.pass));
  if(seq!==joinSeq) return;          // 그 사이 다른 방으로 다시 들어갔으면 이번 것은 버린다
  roomId = rid;
  if(unsubMsgs) unsubMsgs();
  if(unsubMembers) unsubMembers();
  // 방을 바꾸면 이전 방 내용은 화면에서 비운다
  msgs=[]; roomMembers=[]; membersLoaded=false; localPending.length=0; failed.clear(); flipped.clear(); trQueue.length=0; trQueued.clear();
  roomPacks = new Set();
  loaded=false; canAnimate=false; shownIds=new Set(); msgLimit=200; hasOlder=false; keepPos=null; alone=false;
  render();
  paintHeader(null); setStatus(t('connecting'), 'busy');
  // 이 기기에 저장된 사진 이모티콘 코드를 불러오고, 방에도 다시 적어 둔다 (merge: 기존 내용은 유지)
  const mine = savedCodes();
  for(const c of mine) usePack(c);
  // (기다리지 않는다: 인터넷이 느릴 때 이 저장이 끝나기를 기다리느라 대화가 안 뜨는 일을 막는다)
  setDoc(doc(fs,'rooms',roomId,'members',uid),
    { name:me.name, lang:me.lang, role:me.role, seen:Date.now(), ...(mine.length ? { packs: arrayUnion(...mine) } : {}) },
    { merge:true }).catch(()=>{});
  listenMsgs();
  // 이 방에 누가 들어와 있는지 (상대가 같은 비밀번호로 들어왔는지 바로 알 수 있게)
  unsubMembers = onSnapshot(collection(fs,'rooms',roomId,'members'), snap=>{
    const all = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    // 방 합치기: 이 방에 '_moved' 표식 문서가 있으면 거기 적힌 방으로 자동으로 옮겨 간다.
    // 참여자 문서는 자기 uid 이름으로만 쓸 수 있어서(firestore.rules) 이 표식은 앱 사용자가 만들 수 없고,
    // 프로젝트 주인이 Firebase 콘솔에서만 만들 수 있다. 옮겨 간 방은 이 기기에 저장해 다음부터는 바로 그 방으로 들어간다.
    const mv = all.find(m=>m.id==='_moved');
    if(mv && /^[a-f0-9]{64}$/.test(mv.moveTo||'') && mv.moveTo!==roomId && moveHops<3){
      moveHops++; me.room = mv.moveTo; store.set('room', me.room); joinRoom(); return;
    }
    // 이름이 '_'로 시작하는 문서는 사람이 아니라 방 설정이다 (앱에서는 만들 수 없고 Firebase 콘솔에서만 만든다):
    //   _moved = 방 합치기, _packs = 방에 넣어 둔 이모티콘 코드
    roomMembers = all.filter(m=>!m.id.startsWith('_'));
    membersLoaded = true; showRoomStatus(); render();
    // 방의 누군가가 추가한 사진 이모티콘은 내 기기에도 자동으로 불러온다
    for(const mb of all) for(const c of (Array.isArray(mb.packs) ? mb.packs : []).slice(0,30)){
      const mm = typeof c==='string' && PACK_RE.exec(c);
      if(mm && !roomPacks.has(mm[1])) usePack(c);
    }
  }, err=>console.error(err));
  addPending();     // 링크(#pack=코드)로 들어온 경우
}

  render();
}

// 화면으로 돌아오면 실패했던 번역을 자동으로 다시 시도
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ failed.clear(); render(); } });

// ===== 시작 =====
applyUi();
if(auth){
  setStatus(t('connecting'), 'busy');
  onAuthStateChanged(auth, async u=>{
    if(!u){ signInAnonymously(auth).catch(e=>{ console.error(e); setStatus(t('offline'), 'warn'); }); return; }
    uid=u.uid;
    const ready = me.role && me.name && (me.pass || me.room);
    if(ready) joinRoom();
    // 초대 링크로 열었으면 설정 화면에서 확인받는다 (이미 그 방이면 넘어간다)
    if(inviteRoom && inviteRoom===me.room) dropInvite();
    if(inviteRoom || !ready) openSetup();
  });
}
</script>
</body>
</html>
